<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mr. Tallow — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --char: #1C1815;
    --char-raised: #262019;
    --char-line: #3A3128;
    --cream: #F4EEDD;
    --cream-dim: #C9C1AC;
    --tallow: #E8A93D;
    --tallow-dim: #8A6B2C;
    --paprika: #C43D2B;
    --herb: #6B9161;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--char);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Header ---------- */
  .new-order-banner {
    position: sticky; top: 0; z-index: 300;
    background: linear-gradient(90deg, #C43D2B, #A8402A);
    color: #fff;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    animation: bannerPulse 1.4s ease-in-out infinite;
  }
  @keyframes bannerPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.18); }
  }
  .banner-text {
    font-family: 'Bitter', serif; font-weight: 700; font-size: 19px;
  }
  .banner-actions { display: flex; gap: 10px; flex-shrink: 0; }
  .banner-view-btn {
    background: #fff; color: #A8402A; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif;
  }
  .banner-dismiss-btn {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700;
  }

  .promo-banner {
    background: linear-gradient(90deg, #C43D2B, #E8A93D, #C43D2B);
    background-size: 200% 100%;
    color: #fff;
    text-align: center;
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.03em;
    padding: 16px 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.35);
    animation: promoShimmer 4s linear infinite;
  }
  @keyframes promoShimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--char);
    border-bottom: 1px solid var(--char-line);
    padding: 20px 24px 16px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .brand-mark { display: flex; align-items: center; gap: 10px; }
  .brand-mark svg { flex-shrink: 0; }
  .brand-text h1 {
    font-family: 'Bitter', serif; font-weight: 800; font-size: 28px;
    margin: 0; letter-spacing: -0.01em; color: var(--tallow);
  }
  .brand-text p { margin: 2px 0 0; font-size: 14px; color: var(--cream-dim); letter-spacing: 0.02em; }

  .queue-btn {
    position: relative;
    background: var(--char-raised);
    border: 1px solid var(--char-line);
    color: var(--cream);
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .queue-badge {
    background: var(--paprika); color: #fff;
    font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600;
    border-radius: 20px; padding: 1px 8px; min-width: 20px; text-align: center;
  }

  /* ---------- Menu ---------- */
  main { padding: 22px 20px 170px; max-width: 980px; margin: 0 auto; }
  .section-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--tallow-dim);
    margin: 24px 2px 12px;
  }
  .section-label:first-child { margin-top: 4px; }

  .item-card {
    background: var(--char-raised);
    border: 1px solid var(--char-line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; color: var(--cream);
  }
  .item-card:active { background: #2E2620; }
  .item-info h3 {
    font-family: 'Bitter', serif; font-weight: 700; font-size: 17px; margin: 0 0 4px;
  }
  .item-info p { margin: 0; font-size: 12.5px; color: var(--cream-dim); line-height: 1.4; }
  .item-price {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px;
    color: var(--tallow); flex-shrink: 0; white-space: nowrap;
  }

  .menu-columns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
  }
  .menu-col { min-width: 0; }
  .item-card-row {
    display: flex; align-items: stretch; gap: 8px; margin-bottom: 11px;
  }
  .item-card-row .item-card.compact { flex: 1; margin-bottom: 0; }
  .item-card.compact.full-width { width: 100%; }
  .item-card.compact.just-added {
    background: var(--herb); border-color: var(--herb);
    animation: addFlash 0.5s ease-out;
  }
  .item-card.compact.just-added .item-price { color: #fff; }
  @keyframes addFlash {
    0% { transform: scale(1); background: var(--tallow); border-color: var(--tallow); }
    100% { transform: scale(1); background: var(--herb); border-color: var(--herb); }
  }
  .item-card-row.sold-out .item-card.compact { opacity: 0.45; }
  .item-card.compact:disabled { cursor: not-allowed; }
  .eighty6-toggle {
    flex-shrink: 0; width: 52px;
    background: var(--char); border: 1px solid var(--paprika); color: var(--paprika);
    border-radius: 10px; font-size: 12px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
  }
  .eighty6-toggle.restock {
    border-color: var(--herb); color: var(--herb);
  }
  .item-card.compact {
    flex-direction: column; align-items: flex-start; gap: 5px;
    padding: 16px 17px; margin-bottom: 11px;
  }
  .item-card.compact .item-info h3 { font-size: 17px; line-height: 1.28; margin-bottom: 3px; }
  .item-card.compact .item-info p { font-size: 12.5px; line-height: 1.35; }
  .item-card.compact .item-price { font-size: 17px; }

  .sub-columns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .item-card.side {
    flex-direction: column; align-items: flex-start; gap: 4px;
    padding: 15px 16px; margin-bottom: 11px;
  }
  .item-card.side .item-info h3 { font-size: 16px; line-height: 1.28; margin-bottom: 2px; }
  .item-card.side .item-info p { font-size: 12px; line-height: 1.35; }
  .item-card.side .item-price { font-size: 16px; }

  /* ---------- Bottom sheet (customization) ---------- */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(10,8,6,0.6);
    z-index: 40; display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--char-raised);
    width: 100%; max-width: 980px;
    border-radius: 20px 20px 0 0;
    padding: 22px 18px 26px;
    max-height: 88vh; overflow-y: auto;
    border-top: 1px solid var(--char-line);
  }
  .sheet h2 { font-family: 'Bitter', serif; font-size: 21px; margin: 0 0 2px; color: var(--tallow); }
  .sheet .sheet-sub { font-size: 12.5px; color: var(--cream-dim); margin: 0 0 18px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 4px; border-bottom: 1px solid var(--char-line);
  }
  .toggle-row:last-of-type { border-bottom: none; }
  .toggle-label { font-size: 14.5px; font-weight: 500; }
  .toggle-pill {
    width: 50px; height: 28px; border-radius: 20px; border: none;
    background: #4A3F32; position: relative; transition: background 0.15s;
    flex-shrink: 0;
  }
  .toggle-pill.on { background: var(--herb); }
  .toggle-pill.jalapeno.on { background: var(--tallow); }
  .toggle-pill::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--cream);
    transition: transform 0.15s;
  }
  .toggle-pill.on::after { transform: translateX(22px); }

  .qty-row {
    display: flex; align-items: center; justify-content: space-between;
    margin: 18px 0 4px;
  }
  .qty-label { font-size: 14.5px; font-weight: 600; }
  .qty-stepper { display: flex; align-items: center; gap: 14px; }
  .qty-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--char-line);
    background: var(--char); color: var(--cream); font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .qty-num { font-family: 'IBM Plex Mono', monospace; font-size: 16px; min-width: 20px; text-align: center; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary {
    flex: 1; padding: 13px 0; border-radius: 10px; border: 1px solid var(--char-line);
    background: transparent; color: var(--cream-dim); font-size: 14px; font-weight: 600;
  }
  .btn-primary {
    flex: 2; padding: 13px 0; border-radius: 10px; border: none;
    background: var(--tallow); color: var(--char); font-size: 14.5px; font-weight: 700;
  }

  /* ---------- Cart drawer ---------- */
  .cart-drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--char-raised);
    border-top: 1px solid var(--char-line);
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 980px; margin: 0 auto;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.35);
  }
  .cart-summary-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cart-count { font-size: 15px; color: var(--cream-dim); }
  .cart-total {
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 24px; color: var(--tallow);
  }
  .place-order-btn {
    width: 100%; padding: 19px 0; border-radius: 12px; border: none;
    background: var(--tallow); color: var(--char);
    font-size: 18px; font-weight: 700; font-family: 'Bitter', serif;
  }
  .place-order-btn:disabled { background: #4A3F32; color: var(--cream-dim); }

  /* ---------- Cart review sheet ---------- */
  .cart-line {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 4px; border-bottom: 1px solid var(--char-line); gap: 10px;
  }
  .cart-line-name { font-weight: 600; font-size: 14.5px; }
  .cart-line-mods { font-size: 12px; color: var(--cream-dim); margin-top: 3px; line-height: 1.4; }
  .cart-line-price { font-family: 'IBM Plex Mono', monospace; font-size: 14px; white-space: nowrap; }
  .cart-line-remove {
    background: none; border: none; color: var(--paprika); font-size: 12px; margin-top: 6px; padding: 0;
  }

  .name-field { margin: 16px 0 4px; }
  .name-field label { font-size: 12px; color: var(--cream-dim); font-family: 'IBM Plex Mono', monospace; }
  .name-field input {
    width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--char-line); background: var(--char); color: var(--cream); font-size: 15px;
  }
  .name-error {
    color: var(--paprika); font-size: 12.5px; margin-top: 6px; font-weight: 600;
  }
  .quick-names {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
  }
  .quick-name-chip {
    background: var(--char); border: 1px solid var(--char-line); color: var(--cream);
    border-radius: 20px; padding: 8px 15px; font-size: 13.5px; font-weight: 600;
    font-family: 'Inter', sans-serif;
  }
  .quick-name-chip:active { background: var(--tallow); color: var(--char); border-color: var(--tallow); }

  /* ---------- Ticket ---------- */
  .seat-picker-overlay {
    position: fixed; inset: 0; background: var(--char); z-index: 55;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px 30px; overflow-y: auto;
  }
  .seat-picker-header {
    display: flex; align-items: center; gap: 12px; width: 100%; max-width: 500px; margin-bottom: 20px;
  }
  .seat-picker-note {
    background: rgba(232, 169, 61, 0.14); border: 1px solid var(--tallow);
    color: var(--tallow); font-weight: 700; font-size: 15px;
    border-radius: 10px; padding: 12px 18px; text-align: center;
    flex: 1;
  }
  .skip-seat-top-btn {
    flex-shrink: 0; background: var(--char-raised); border: 1px solid var(--char-line); color: var(--cream-dim);
    border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
  }
  .floorplan-wrap {
    position: relative; width: 100%; max-width: 480px;
  }
  .floorplan-img { width: 100%; height: auto; display: block; border-radius: 10px; }
  .seat-zone {
    position: absolute; background: rgba(232, 169, 61, 0.0); border: 2px solid transparent;
    border-radius: 6px; padding: 0; cursor: pointer;
  }
  .seat-zone:active { background: rgba(232, 169, 61, 0.35); border-color: var(--tallow); }
  .back-patio-btn {
    margin-top: 18px; width: 100%; max-width: 480px;
    background: rgba(107, 145, 97, 0.12); border: 1px solid var(--herb); color: var(--herb);
    border-radius: 10px; padding: 15px 20px; font-size: 15px; font-weight: 700; font-family: 'Bitter', serif;
  }
  .back-patio-btn:active { background: var(--herb); color: #fff; }
  .skip-seat-btn {
    margin-top: 14px; background: none; border: 1px solid var(--char-line); color: var(--cream-dim);
    border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
  }

  .ticket-overlay {
    position: fixed; inset: 0; background: var(--char); z-index: 50;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 30px; overflow-y: auto;
  }
  .clip {
    width: 46px; height: 22px; border: 3px solid var(--tallow-dim); border-bottom: none;
    border-radius: 10px 10px 0 0; margin-bottom: -2px;
  }
  .ticket {
    background: var(--cream); color: var(--char);
    width: 100%; max-width: 380px; border-radius: 4px;
    padding: 26px 22px 20px; position: relative;
  }
  .ticket::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 8px;
    background-image: radial-gradient(circle at 7px 0, transparent 4px, var(--cream) 4.5px);
    background-size: 14px 8px; background-repeat: repeat-x;
  }
  .ticket-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em;
    color: var(--paprika); text-transform: uppercase; margin-bottom: 4px;
  }
  .ticket h2 { font-family: 'Bitter', serif; font-size: 22px; margin: 0 0 2px; }
  .ticket-time { font-size: 11.5px; color: #6B6055; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace; }
  .ticket-seat {
    font-size: 13px; font-weight: 700; color: var(--paprika); margin-bottom: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .ticket-item { padding: 9px 0; border-top: 1px dashed #D8CCB8; }
  .ticket-item:first-of-type { border-top: 1px solid #2A2118; padding-top: 14px; }
  .ticket-item-name { font-weight: 700; font-size: 14.5px; }
  .ticket-item-mods { font-size: 12px; color: #6B6055; margin-top: 2px; }
  .ticket-subrow {
    display: flex; justify-content: space-between; font-size: 13px; color: #6B6055;
    font-family: 'IBM Plex Mono', monospace; padding: 2px 0;
  }
  .ticket-total-row {
    display: flex; justify-content: space-between; margin-top: 16px; padding-top: 14px;
    border-top: 1px solid #2A2118; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 18px;
  }
  .ticket-actions {
    display: flex; gap: 12px; margin-top: 30px; width: 100%; max-width: 380px;
  }
  .complete-order-btn {
    flex: 1; background: var(--tallow); color: var(--char); border: none;
    border-radius: 12px; padding: 15px 0; font-size: 15px; font-weight: 700; font-family: 'Bitter', serif;
  }

  .pay-note {
    text-align: center; font-size: 12.5px; font-weight: 600; color: #2A2118;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #2A2118;
  }
  .pay-divider {
    text-align: center; font-size: 10.5px; color: #8A7F6C; text-transform: uppercase;
    letter-spacing: 0.08em; margin: 14px 0 10px; font-family: 'IBM Plex Mono', monospace;
  }
  .pay-options {
    display: flex; justify-content: space-between; gap: 8px;
  }
  .pay-options.single {
    justify-content: center;
  }
  .pay-options.single .pay-option {
    flex: 0 0 auto; width: 180px;
  }
  .pay-options.single .pay-option img {
    max-width: 160px;
  }
  .pay-option {
    flex: 1; text-align: center;
  }
  .pay-option img {
    width: 100%; max-width: 90px; border-radius: 6px; border: 1px solid #D8CCB8;
  }
  .pay-option-label {
    font-size: 11px; font-weight: 700; color: #2A2118; margin-top: 5px;
  }
  .pay-option-handle {
    font-size: 9.5px; color: #6B6055; word-break: break-all;
  }

  .payment-select-overlay {
    position: fixed; inset: 0; background: var(--char); z-index: 55;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .payment-select-card {
    background: var(--char-raised); border: 1px solid var(--char-line); border-radius: 16px;
    padding: 26px 22px; width: 100%; max-width: 400px;
  }
  .payment-select-card h2 {
    font-family: 'Bitter', serif; font-size: 21px; color: var(--tallow); margin: 0 0 2px; text-align: center;
  }
  .payment-select-card .sheet-sub { text-align: center; margin-bottom: 20px; }
  .customer-egg {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    margin-bottom: 18px; padding: 12px; background: rgba(232, 169, 61, 0.08);
    border: 1px solid var(--char-line); border-radius: 12px;
  }
  .customer-egg-caption {
    font-family: 'Bitter', serif; font-weight: 700; font-size: 15px; color: var(--tallow);
  }
  .payment-method-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .payment-method-btn {
    background: var(--char); border: 1px solid var(--char-line); color: var(--cream);
    border-radius: 10px; padding: 18px 10px; font-size: 15px; font-weight: 700;
    font-family: 'Bitter', serif;
  }
  .payment-method-btn:active { background: var(--tallow); color: var(--char); }
  .payment-method-btn.suggested { border-color: var(--tallow); box-shadow: 0 0 0 2px rgba(232, 169, 61, 0.3) inset; }
  .payment-method-btn[data-method="zelle"] { grid-column: 1 / -1; }
  .pm-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; opacity: 0.7; }

  .tip-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .tip-btn {
    background: var(--char); border: 1px solid var(--char-line); color: var(--cream);
    border-radius: 10px; padding: 14px 6px; font-size: 15px; font-weight: 700;
    font-family: 'Bitter', serif; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .tip-btn.active { background: var(--tallow); color: var(--char); border-color: var(--tallow); }
  .tip-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; opacity: 0.75; }
  .custom-tip-row { margin-bottom: 16px; }
  .custom-tip-row label {
    font-size: 12px; color: var(--cream-dim); font-family: 'IBM Plex Mono', monospace;
  }
  .custom-tip-row input {
    width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px;
    border: 1px solid var(--char-line); background: var(--char); color: var(--cream); font-size: 15px;
  }
  .fee-notice {
    background: rgba(196, 61, 43, 0.12); border: 1px solid var(--paprika);
    color: var(--cream); border-radius: 8px; padding: 11px 13px; font-size: 13px;
    margin-bottom: 16px; line-height: 1.4;
  }
  .fee-notice strong { color: var(--paprika); }
  .tip-total-row {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 19px; color: var(--tallow);
    padding: 12px 0; border-top: 1px solid var(--char-line); margin-bottom: 4px;
  }

  /* ---------- Queue panel ---------- */
  .queue-overlay {
    position: fixed; inset: 0; background: var(--char); z-index: 45;
    display: flex; flex-direction: column;
  }
  .queue-header {
    padding: 18px 18px 14px; border-bottom: 1px solid var(--char-line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .queue-header h2 { font-family: 'Bitter', serif; margin: 0; font-size: 20px; color: var(--tallow); }
  .sync-status { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--herb); margin-top: 3px; }
  .close-btn { background: var(--char-raised); border: 1px solid var(--char-line); color: var(--cream); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .clear-completed-row {
    padding: 10px 16px 0; max-width: 940px; margin: 0 auto; width: 100%;
  }
  .clear-completed-btn {
    width: 100%; background: var(--char-raised); border: 1px solid var(--paprika); color: var(--paprika);
    border-radius: 10px; padding: 11px 0; font-size: 13.5px; font-weight: 600; font-family: 'Inter', sans-serif;
  }
  .queue-list { flex: 1; overflow-y: auto; padding: 14px 16px; max-width: 940px; margin: 0 auto; width: 100%; }
  .queue-ticket {
    background: var(--char-raised); border: 1px solid var(--char-line); border-left: 4px solid var(--tallow);
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .queue-ticket.done { border-left-color: var(--herb); opacity: 0.7; }
  .queue-ticket-top { display: flex; justify-content: space-between; align-items: center; }
  .queue-ticket-num { font-family: 'IBM Plex Mono', monospace; color: var(--paprika); font-size: 12px; }
  .status-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
    background: var(--tallow); color: var(--char);
  }
  .status-badge.done { background: var(--herb); color: #fff; }
  .queue-ticket-name { font-family: 'Bitter', serif; font-weight: 700; font-size: 16px; margin-top: 2px; }
  .queue-ticket-pay {
    display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--tallow); background: rgba(232, 169, 61, 0.12);
    border: 1px solid var(--tallow-dim); border-radius: 6px; padding: 2px 8px; margin-top: 5px;
  }
  .queue-ticket-items { font-size: 12.5px; color: var(--cream-dim); margin-top: 6px; line-height: 1.5; }
  .queue-ticket-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .queue-total { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: var(--tallow); }
  .done-btn {
    background: none; border: 1px solid var(--herb); color: var(--herb);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600;
  }
  .queue-ticket.done .done-btn { border-color: var(--cream-dim); color: var(--cream-dim); }
  .queue-ticket-btns { display: flex; gap: 8px; }
  .delete-btn {
    background: none; border: 1px solid var(--paprika); color: var(--paprika);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600;
  }
  .queue-empty { text-align: center; color: var(--cream-dim); font-size: 13px; padding: 60px 20px; }
</style>

// ---------- Firebase (shared order queue across devices) ----------
const firebaseConfig = {
  apiKey: "AIzaSyA1twUJqU0EH84yF6VPYyOmotTGuRugjNk",
  authDomain: "mr-tallow.firebaseapp.com",
  databaseURL: "https://mr-tallow-default-rtdb.firebaseio.com",
  projectId: "mr-tallow",
  storageBucket: "mr-tallow.firebasestorage.app",
  messagingSenderId: "264467639866",
  appId: "1:264467639866:web:db3dbd7fcd278a2e614f03"
};
let db = null;
let firebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
} catch (e) {
  console.error("Firebase failed to initialize — falling back to local-only queue.", e);
}

let hasLoadedOrdersOnce = false;
let knownOrderIds = new Set();

function listenToOrders() {
  if (!db) return;
  db.ref("orders").on("value", (snapshot) => {
    const val = snapshot.val() || {};
    const entries = Object.keys(val)
      .map(key => ({ id: key, ...val[key] }))
      .sort((a, b) => (b.num || 0) - (a.num || 0));

    if (hasLoadedOrdersOnce) {
      const newOnes = entries.filter(e => !knownOrderIds.has(e.id));
      if (newOnes.length > 0) {
        const latest = newOnes.reduce((a, b) => ((a.num || 0) > (b.num || 0) ? a : b));
        state.newOrderAlert = { num: latest.num, name: latest.name, total: latest.total };
      }
    }
    knownOrderIds = new Set(entries.map(e => e.id));
    hasLoadedOrdersOnce = true;

    state.queue = entries;
    render();
  }, (err) => {
    console.error("Firebase read failed:", err);
  });
}

function listenToEighty6() {
  if (!db) return;
  db.ref("eighty6").on("value", (snapshot) => {
    const val = snapshot.val() || {};
    state.eighty6 = new Set(Object.keys(val).filter(k => val[k]));
    render();
  }, (err) => {
    console.error("Firebase read failed (86 list):", err);
  });
}
function toggleEighty6(itemId, event) {
  if (event) event.stopPropagation();
  const isOut = state.eighty6.has(itemId);
  if (firebaseReady && db) {
    if (isOut) {
      db.ref("eighty6/" + itemId).remove().catch(err => console.error("86 toggle failed:", err));
    } else {
      db.ref("eighty6/" + itemId).set(true).catch(err => console.error("86 toggle failed:", err));
    }
  } else {
    if (isOut) state.eighty6.delete(itemId);
    else state.eighty6.add(itemId);
    render();

function fmt(n) { return "$" + n.toFixed(2); }

function renderMenuRow(item, kind) {
  const soldOut = state.eighty6.has(item.id);
  const justAdded = state.recentlyAddedId === item.id;
  const dataAttr = `data-${kind}="${item.id}"`;
  return `
    <div class="item-card-row ${soldOut ? 'sold-out' : ''}">
      <button class="item-card compact full-width ${justAdded ? 'just-added' : ''}" ${dataAttr} ${soldOut ? 'disabled' : ''}>
        <div class="item-info"><h3>${item.name}</h3><p>${item.desc}</p></div>
        <div class="item-price">${justAdded ? '✓ Added' : (soldOut ? 'Sold Out' : fmt(item.price))}</div>
      </button>
    </div>
  `;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function openBurgerSheet(item) {
  state.sheetType = "burger";
  state.sheetItem = item;
  state.sheetMods = { onions: true, mustard: true, pickle: true, cheese: true, jalapenoRaw: false, jalapenoGrilled: false };
  state.sheetQty = 1;
  render();
}
function openTacoSheet(item) {
  state.sheetType = "taco";
  state.sheetItem = item;
  state.sheetMods = { onion: true, jalapenoRaw: false, jalapenoGrilled: false };
  state.sheetTortilla = "corn";
  state.sheetQty = 1;
  render();
}
function openQuesadillaSheet(item) {
  state.sheetType = "quesadilla";
  state.sheetItem = item;
  state.sheetProtein = "chicken";
  state.sheetQty = 1;
  render();
}
function closeSheet() {
  state.sheetType = null;
  state.sheetItem = null;
  render();
}
function toggleMod(key) {
  state.sheetMods[key] = !state.sheetMods[key];
  render();
}
function setProtein(p) {
  state.sheetProtein = p;
  render();
}
function changeQty(delta) {
  state.sheetQty = Math.max(1, state.sheetQty + delta);
  render();
}
function modsToText(mods) {
  const parts = [];
  const removed = [];
  if (!mods.onions) removed.push("no onions");
  if (!mods.mustard) removed.push("no mustard");
  if (!mods.pickle) removed.push("no pickle");
  if (!mods.cheese) removed.push("no cheese");
  if (mods.jalapenoRaw) parts.push("add raw jalapeño");
  if (mods.jalapenoGrilled) parts.push("add grilled jalapeño");
  const out = [...removed, ...parts];
  return out.length ? out.join(", ") : "as usual";
}
function tacoModsToText(mods, tortilla) {
  const parts = [];
  parts.push(tortilla === "flour" ? "flour tortilla" : "corn tortilla");
  if (!mods.onion) parts.push("no onion");
  if (mods.jalapenoRaw) parts.push("add raw jalapeño");
  if (mods.jalapenoGrilled) parts.push("add grilled jalapeño");
  return parts.join(", ");
}
function addBurgerToCart() {
  const item = state.sheetItem;
  const mods = state.sheetMods;
  state.cart.push({
    id: uid(),
    name: item.name,
    unitPrice: item.price,
    qty: state.sheetQty,
    modsText: modsToText(mods)
  });
  state.sheetType = null;
  state.sheetItem = null;
  render();
}
function setTortilla(kind) {
  state.sheetTortilla = kind;
  render();
}
function addTacoToCart() {
  const item = state.sheetItem;
  const mods = state.sheetMods;
  state.cart.push({
    id: uid(),
    name: item.name,
    unitPrice: item.price,
    qty: state.sheetQty,
    modsText: tacoModsToText(mods, state.sheetTortilla)
  });
  state.sheetType = null;
  state.sheetItem = null;
  render();
}
function addQuesadillaToCart() {
  const item = state.sheetItem;
  const protein = state.sheetProtein;
  state.cart.push({
    id: uid(),
    name: item.name,
    unitPrice: item.price,
    qty: state.sheetQty,
    modsText: protein === "chicken" ? "Chicken" : "Pork"
  });
  state.sheetType = null;
  state.sheetItem = null;
  render();
}
function addSideToCart(item) {
  const existing = state.cart.find(c => c.name === item.name && c.modsText === null);
  if (existing) {
    existing.qty += 1;
  } else {
    state.cart.push({ id: uid(), name: item.name, unitPrice: item.price, qty: 1, modsText: null });
  }
  state.recentlyAddedId = item.id;
  render();
  setTimeout(() => {
    if (state.recentlyAddedId === item.id) {
      state.recentlyAddedId = null;
      render();
    }
  }, 500);
}
function addShrimpToCart(item) {
  const existing = state.cart.find(c => c.name === item.name && c.modsText === null);
  if (existing) {
    existing.qty += 1;
  } else {
    state.cart.push({ id: uid(), name: item.name, unitPrice: item.price, qty: 1, modsText: null });
  }
  const friesLine = state.cart.find(c => c.name === "Fries" && c.modsText === "Included with shrimp");
  if (friesLine) {
    friesLine.qty += 1;
  } else {
    state.cart.push({ id: uid(), name: "Fries", unitPrice: 0, qty: 1, modsText: "Included with shrimp" });
  }
  state.recentlyAddedId = item.id;
  render();
  setTimeout(() => {
    if (state.recentlyAddedId === item.id) {
      state.recentlyAddedId = null;
      render();
    }
  }, 500);
}
function removeCartLine(id) {
  state.cart = state.cart.filter(c => c.id !== id);
  render();
}
function cartTotal() {
  return state.cart.reduce((s, c) => s + c.unitPrice * c.qty, 0);
}
function cartCount() {
  return state.cart.reduce((s, c) => s + c.qty, 0);
}
function openCartReview() { state.showCartReview = true; render(); }
function closeCartReview() { state.showCartReview = false; render(); }

function getCustomerEasterEgg(name) {
  return CUSTOMER_EASTER_EGGS[(name || "").trim().toLowerCase()] || null;
}

function goToPaymentSelect() {
  if (state.cart.length === 0) return;
  if (!state.customerName || !state.customerName.trim()) {
    state.nameError = "Enter a name before continuing.";
    render();
    return;
  }
  state.nameError = null;
  state.showCartReview = false;
  state.showPaymentSelect = true;
  render();
}
function backToCartReview() {
  state.showPaymentSelect = false;
  state.showCartReview = true;
  render();
}
function backToPaymentSelect() {
  state.showTipSelect = false;
  state.showPaymentSelect = true;
  render();
}

const PAYMENT_METHODS = {
  cash:   { label: "Cash",  qr: null },
  square: { label: "Card (Square)", qr: null }
};

// Square's standard in-person rate as of 2026: 2.6% + $0.15 per transaction.
const SQUARE_FEE_RATE = 0.026;
const SQUARE_FEE_FLAT = 0.15;
function squareFeeOn(amount) {
  return Math.round((amount * SQUARE_FEE_RATE + SQUARE_FEE_FLAT) * 100) / 100;
}

function choosePaymentMethod(method) {
  if (method === "cash") {
    finalizeOrder("cash", 0, 0);
    return;
  }
  state.pendingMethod = method;
  state.tipAmount = 0;
  state.customTip = "";
  state.showPaymentSelect = false;
  state.showTipSelect = true;
  render();
}

function setTipPercent(pct) {
  state.tipAmount = Math.round(cartTotal() * pct * 100) / 100;
  state.customTip = "";
  render();
}
function setCustomTip(val) {
  state.customTip = val;
  const n = parseFloat(val);
  state.tipAmount = isNaN(n) || n < 0 ? 0 : n;
  render();
}
function confirmTipAndPay() {
  const method = state.pendingMethod;
  const tip = state.tipAmount || 0;
  const fee = method === "square" ? squareFeeOn(cartTotal() + tip) : 0;
  finalizeOrder(method, tip, fee);
}

function finalizeOrder(method, tip, fee) {
  if (state.cart.length === 0) return;
  const subtotal = cartTotal();
  const orderData = {
    name: state.customerName.trim() || "Guest",
    items: state.cart.map(c => ({ ...c })),
    subtotal: subtotal,
    tip: tip || 0,
    fee: fee || 0,
    total: Math.round((subtotal + (tip || 0) + (fee || 0)) * 100) / 100,
    time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
    date: new Date().toLocaleDateString([], { month: "short", day: "numeric" }),
    done: false,
    paymentMethod: method
  };
  state.cart = [];
  state.customerName = "";
  state.showPaymentSelect = false;
  state.showTipSelect = false;
  state.pendingMethod = null;
  state.tipAmount = 0;
  state.customTip = "";

  if (firebaseReady && db) {
    // Atomically assign the next ticket number so two devices never collide.
    db.ref("meta/nextTicketNum").transaction(current => (current || 1) + 1)
      .then(result => {
        const assignedNum = (result.snapshot.val() || 2) - 1;
        const ticket = { ...orderData, num: assignedNum };
        const newRef = db.ref("orders").push();
        return newRef.set(ticket).then(() => {
          state.ticket = { id: newRef.key, ...ticket };
          state.showSeatPicker = true;
          render();
        });
      })
      .catch(err => {
        console.error("Firebase write failed, falling back to local-only order:", err);
        const localTicket = { id: uid(), num: state.nextTicketNum, ...orderData };
        state.nextTicketNum += 1;
        state.queue.unshift(localTicket);
        state.ticket = localTicket;
        state.showSeatPicker = true;
        render();
      });
  } else {
    const localTicket = { id: uid(), num: state.nextTicketNum, ...orderData };
    state.nextTicketNum += 1;
    state.queue.unshift(localTicket);
    state.ticket = localTicket;
    state.showSeatPicker = true;
    render();
  }
}
function selectSeat(label) {
  if (state.ticket) {
    state.ticket.seat = label;
    if (firebaseReady && db && state.ticket.id) {
      db.ref("orders/" + state.ticket.id + "/seat").set(label).catch(err => console.error("Seat update failed:", err));
    }
  }
  state.showSeatPicker = false;
  render();
}
function skipSeat() {
  state.showSeatPicker = false;
  render();
}
function newOrder() {
  state.ticket = null;
  render();
}
function deleteQueueTicket(id) {
  if (firebaseReady && db) {
    db.ref("orders/" + id).remove().catch(err => console.error("Delete failed:", err));
  } else {
    state.queue = state.queue.filter(t => t.id !== id);
    render();
  }
}
function toggleQueueDone(id) {
  if (firebaseReady && db) {
    const t = state.queue.find(t => t.id === id);
    if (!t) return;
    db.ref("orders/" + id + "/done").set(!t.done).catch(err => console.error("Update failed:", err));
  } else {
    const t = state.queue.find(t => t.id === id);
    if (t) t.done = !t.done;
    render();
  }
}
function clearCompletedOrders() {
  const doneTickets = state.queue.filter(t => t.done);
  if (doneTickets.length === 0) return;
  if (firebaseReady && db) {
    const updates = {};
    doneTickets.forEach(t => { updates["orders/" + t.id] = null; });
    db.ref().update(updates).catch(err => console.error("Clear completed failed:", err));
  } else {
    state.queue = state.queue.filter(t => !t.done);
    render();
  }
}
function openQueue() { state.showQueue = true; render(); }

function renderNewOrderBanner() {
  if (!state.newOrderAlert) return "";
  const a = state.newOrderAlert;
  return `
    <div class="new-order-banner" id="new-order-banner">
      <span class="banner-text">🔔 New Order — #${String(a.num).padStart(3, "0")} · ${escapeHtml(a.name)} · ${fmt(a.total || 0)}</span>
      <div class="banner-actions">
        <button class="banner-view-btn" id="banner-view-btn">View</button>
        <button class="banner-dismiss-btn" id="banner-dismiss-btn">✕</button>
      </div>
    </div>
  `;
}
function wireNewOrderBanner() {
  const viewBtn = document.getElementById("banner-view-btn");
  const dismissBtn = document.getElementById("banner-dismiss-btn");
  if (viewBtn) viewBtn.addEventListener("click", () => {
    state.newOrderAlert = null;
    openQueue();
  });
  if (dismissBtn) dismissBtn.addEventListener("click", () => {
    state.newOrderAlert = null;
    render();
  });
}
function closeQueue() { state.showQueue = false; render(); }

function render() {
  const root = document.getElementById("root");
  const pendingCount = state.queue.filter(t => !t.done).length;

  // Seat picker shows right after checkout, before the ticket
  if (state.ticket && state.showSeatPicker) {
    root.innerHTML = `
      <div class="seat-picker-overlay">
        <div class="seat-picker-header">
          <div class="seat-picker-note">If it's busy, please tap where you're sitting.</div>
          <button class="skip-seat-top-btn" id="skip-seat-top-btn">Skip</button>
        </div>
        <div class="floorplan-wrap">
          <img src="${FLOORPLAN_IMG}" class="floorplan-img" alt="Floor plan" />
          ${SEAT_ZONES.map(z => `
            <button class="seat-zone" data-seat="${escapeHtml(z.label)}"
              style="left:${z.left}%;top:${z.top}%;width:${z.width}%;height:${z.height}%;"
              aria-label="${escapeHtml(z.label)}"></button>
          `).join("")}
        </div>
        <button class="back-patio-btn" id="back-patio-btn">🌿 Back Patio</button>
        <button class="skip-seat-btn" id="skip-seat-btn">Skip — I'll tell them at pickup</button>
      </div>
    `;
    root.querySelectorAll("[data-seat]").forEach(btn => {
      btn.addEventListener("click", () => selectSeat(btn.dataset.seat));
    });
    document.getElementById("back-patio-btn").addEventListener("click", () => selectSeat("Back Patio"));
    document.getElementById("skip-seat-btn").addEventListener("click", skipSeat);
    document.getElementById("skip-seat-top-btn").addEventListener("click", skipSeat);
    return;
  }

  // Fullscreen ticket takes over everything
  if (state.ticket) {
    const t = state.ticket;
    const pm = PAYMENT_METHODS[t.paymentMethod] || { label: t.paymentMethod };
    const qrSrc = pm.qr === "QR_VENMO" ? QR_VENMO : pm.qr === "QR_CASHAPP" ? QR_CASHAPP : pm.qr === "QR_ZELLE" ? QR_ZELLE : null;
    root.innerHTML = `
      <div class="ticket-overlay">
        <div class="clip"></div>
        <div class="ticket">
          <div class="ticket-num">Order #${String(t.num).padStart(3, "0")}</div>
          <h2>${escapeHtml(t.name)}</h2>
          <div class="ticket-time">${t.date ? t.date + " · " : ""}${t.time}</div>
          ${t.seat ? `<div class="ticket-seat">📍 ${escapeHtml(t.seat)}</div>` : ""}
          ${t.items.map(it => `
            <div class="ticket-item">
              <div class="ticket-item-name">${it.qty > 1 ? it.qty + "× " : ""}${escapeHtml(it.name)}</div>
              ${it.modsText ? `<div class="ticket-item-mods">${escapeHtml(it.modsText)}</div>` : ""}
            </div>
          `).join("")}
          ${(t.tip > 0 || t.fee > 0) ? `
            <div class="ticket-subrow"><span>Subtotal</span><span>${fmt(t.subtotal)}</span></div>
            ${t.tip > 0 ? `<div class="ticket-subrow"><span>Tip</span><span>${fmt(t.tip)}</span></div>` : ""}
            ${t.fee > 0 ? `<div class="ticket-subrow"><span>Card fee</span><span>${fmt(t.fee)}</span></div>` : ""}
          ` : ""}
          <div class="ticket-total-row"><span>Total</span><span>${fmt(t.total)}</span></div>
          ${qrSrc ? `
            <div class="pay-note">Scan to pay with ${pm.label}</div>
            <div class="pay-options single">
              <div class="pay-option">
                <img src="${qrSrc}" alt="${pm.label} QR" />
                <div class="pay-option-label">${pm.label}</div>
                <div class="pay-option-handle">${pm.handle}</div>
              </div>
            </div>
          ` : `
            <div class="pay-note">Paying with ${pm.label} — collect payment at pickup</div>
          `}
        </div>
        <div class="ticket-actions">
          <button class="complete-order-btn" id="done-order-btn">Done</button>
        </div>
      </div>
    `;
    document.getElementById("done-order-btn").addEventListener("click", newOrder);
    return;
  }

  // Payment method selection takes over
  if (state.showPaymentSelect) {
    const egg = getCustomerEasterEgg(state.customerName);
    root.innerHTML = `
      <div class="payment-select-overlay">
        <div class="payment-select-card">
          <h2>Please Select Payment Method</h2>
          <p class="sheet-sub">${cartCount()} item${cartCount() > 1 ? "s" : ""} · ${fmt(cartTotal())}</p>
          ${egg ? `
            <div class="customer-egg">
              ${egg.svg}
              <div class="customer-egg-caption">${escapeHtml(egg.caption)}</div>
            </div>
          ` : ""}
          <div class="payment-method-grid">
            <button class="payment-method-btn" data-method="cash">Cash</button>
            <button class="payment-method-btn" data-method="square">Card<br><span class="pm-sub">(Square)</span></button>
          </div>
          <button class="btn-secondary" id="back-to-cart-btn" style="margin-top:16px;width:100%;">Back</button>
        </div>
      </div>
    `;
    root.querySelectorAll(".payment-method-btn").forEach(btn => {
      btn.addEventListener("click", () => choosePaymentMethod(btn.dataset.method));
    });
    document.getElementById("back-to-cart-btn").addEventListener("click", backToCartReview);
    return;
  }

  // Tip selection (all non-cash methods) takes over
  if (state.showTipSelect) {
    const method = state.pendingMethod;
    const pm = PAYMENT_METHODS[method] || { label: method };
    const subtotal = cartTotal();
    const tip = state.tipAmount || 0;
    const fee = method === "square" ? squareFeeOn(subtotal + tip) : 0;
    const finalTotal = subtotal + tip + fee;
    root.innerHTML = `
      <div class="payment-select-overlay">
        <div class="payment-select-card">
          <h2>Add a Tip?</h2>
          <p class="sheet-sub">Paying with ${escapeHtml(pm.label)} · Subtotal ${fmt(subtotal)}</p>
          <div class="tip-grid">
            <button class="tip-btn ${tip === 0 && !state.customTip ? 'active' : ''}" data-tip="0">No Tip</button>
            <button class="tip-btn" data-tip="0.15">15%<span class="tip-sub">${fmt(subtotal*0.15)}</span></button>
            <button class="tip-btn" data-tip="0.20">20%<span class="tip-sub">${fmt(subtotal*0.20)}</span></button>
            <button class="tip-btn" data-tip="0.25">25%<span class="tip-sub">${fmt(subtotal*0.25)}</span></button>
          </div>
          <div class="custom-tip-row">
            <label>Custom tip amount</label>
            <input type="number" id="custom-tip-input" placeholder="0.00" step="0.01" min="0" value="${state.customTip}" />
          </div>
          ${method === "square" ? `
            <div class="fee-notice">
              A card processing fee (2.6% + $0.15) applies to Square payments: <strong>+${fmt(fee)}</strong>
            </div>
          ` : ""}
          <div class="tip-total-row">
            <span>Total to charge</span>
            <span>${fmt(finalTotal)}</span>
          </div>
          <div class="sheet-actions">
            <button class="btn-secondary" id="back-to-payment-btn">Back</button>
            <button class="btn-primary" id="confirm-tip-btn">Place Order — ${fmt(finalTotal)}</button>
          </div>
        </div>
      </div>
    `;
    root.querySelectorAll(".tip-btn").forEach(btn => {
      btn.addEventListener("click", () => setTipPercent(parseFloat(btn.dataset.tip)));
    });
    document.getElementById("custom-tip-input").addEventListener("input", (e) => setCustomTip(e.target.value));
    document.getElementById("back-to-payment-btn").addEventListener("click", backToPaymentSelect);
    document.getElementById("confirm-tip-btn").addEventListener("click", confirmTipAndPay);
    return;
  }

  // Kitchen queue takes over
  if (state.showQueue) {
    root.innerHTML = `
      <div class="queue-overlay">
        <div class="queue-header">
          <div>
            <h2>Today's Orders</h2>
            <div class="sync-status">${firebaseReady ? "● synced across devices" : "● this device only"}</div>
          </div>
          <button class="close-btn" id="close-queue-btn">Close</button>
        </div>
        ${state.queue.some(t => t.done) ? `
        <div class="clear-completed-row">
          <button class="clear-completed-btn" id="clear-completed-btn">Clear completed (${state.queue.filter(t => t.done).length})</button>
        </div>` : ""}
        <div class="queue-list">
          ${state.queue.length === 0 ? `<div class="queue-empty">No orders yet today.</div>` :
            state.queue.map(t => `
              <div class="queue-ticket ${t.done ? 'done' : ''}">
                <div class="queue-ticket-top">
                  <span class="queue-ticket-num">#${String(t.num).padStart(3, "0")} · ${t.date ? t.date + " · " : ""}${t.time}</span>
                  <span class="status-badge ${t.done ? 'done' : ''}">${t.done ? "Done" : "Pending"}</span>
                </div>
                <div class="queue-ticket-name">${escapeHtml(t.name)}</div>
                <div class="queue-ticket-pay">${escapeHtml((PAYMENT_METHODS[t.paymentMethod] || {}).label || t.paymentMethod || "—")}</div>
                <div class="queue-ticket-items">
                  ${t.items.map(it => `${it.qty > 1 ? it.qty + "× " : ""}${escapeHtml(it.name)}${it.modsText ? " (" + escapeHtml(it.modsText) + ")" : ""}`).join("<br>")}
                </div>
                <div class="queue-ticket-bottom">
                  <span class="queue-total">${fmt(t.total)}</span>
                  <div class="queue-ticket-btns">
                    <button class="done-btn" data-id="${t.id}">${t.done ? "Mark pending" : "Mark done"}</button>
                    <button class="delete-btn" data-id="${t.id}">Delete</button>
                  </div>
                </div>
              </div>
            `).join("")
          }
        </div>
      </div>
    `;
    document.getElementById("close-queue-btn").addEventListener("click", closeQueue);
    const clearBtn = document.getElementById("clear-completed-btn");
    if (clearBtn) clearBtn.addEventListener("click", clearCompletedOrders);
    root.querySelectorAll(".done-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleQueueDone(btn.dataset.id));
    });
    root.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", () => deleteQueueTicket(btn.dataset.id));
    });
    return;
  }

  // Main menu screen
  root.innerHTML = `
    <header>
      <div class="brand-mark">
        <div class="brand-text">
          <h1>Mr. Tallow</h1>
          <p>at Cobble &amp; Spoke</p>
        </div>
      </div>
    </header>

    <div class="promo-banner">🍤 FRIED SHRIMP SUNDAY 🍤</div>

    <main>
      <div class="menu-columns">
        <div class="menu-col">
          <div class="section-label">🍤 Fried Shrimp</div>
          ${MENU.shrimp.filter(item => item.id.startsWith("fried-shrimp")).map(item => renderMenuRow(item, "shrimp")).join("")}

          <div class="section-label">Smash Burgers</div>
          ${MENU.burgers.map(item => renderMenuRow(item, "burger")).join("")}

          <div class="section-label">Sliders</div>
          ${MENU.sliders.map(item => renderMenuRow(item, "slider")).join("")}

          <div class="section-label">Sides</div>
          ${MENU.sides.map(item => renderMenuRow(item, "side")).join("")}
        </div>
        <div class="menu-col">
          <div class="section-label">🥥 Coconut Fried Shrimp</div>
          ${MENU.shrimp.filter(item => item.id.startsWith("coconut-shrimp")).map(item => renderMenuRow(item, "shrimp")).join("")}

          <div class="section-label">Tacos</div>
          ${MENU.tacos.map(item => renderMenuRow(item, "taco")).join("")}

          <div class="section-label">Quesadillas</div>
          ${MENU.quesadillas.map(item => renderMenuRow(item, "quesadilla")).join("")}

          <div class="section-label">Appetizers</div>
          ${MENU.eggrolls.map(item => renderMenuRow(item, "eggroll")).join("")}
        </div>
      </div>
    </main>

    ${state.cart.length > 0 ? `
    <div class="cart-drawer" id="cart-drawer">
      <div class="cart-summary-row">
        <span class="cart-count">${cartCount()} item${cartCount() > 1 ? "s" : ""} in your order</span>
        <span class="cart-total">${fmt(cartTotal())}</span>
      </div>
      <button class="place-order-btn" id="review-cart-btn">Review &amp; Place Order</button>
    </div>` : ""}

    ${state.sheetType ? renderSheet() : ""}
    ${state.showCartReview ? renderCartReview() : ""}
  `;

  root.querySelectorAll("[data-burger]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.burgers.find(b => b.id === btn.dataset.burger);
      openBurgerSheet(item);
    });
  });
  root.querySelectorAll("[data-taco]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.tacos.find(t => t.id === btn.dataset.taco);
      openTacoSheet(item);
    });
  });
  root.querySelectorAll("[data-quesadilla]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.quesadillas.find(q => q.id === btn.dataset.quesadilla);
      if (item.id === "quesa-cheese") {
        addSideToCart(item);
      } else {
        openQuesadillaSheet(item);
      }
    });
  });
  root.querySelectorAll("[data-side]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.sides.find(s => s.id === btn.dataset.side);
      addSideToCart(item);
    });
  });
  root.querySelectorAll("[data-eggroll]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.eggrolls.find(e => e.id === btn.dataset.eggroll);
      addSideToCart(item);
    });
  });
  root.querySelectorAll("[data-shrimp]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.shrimp.find(s => s.id === btn.dataset.shrimp);
      addShrimpToCart(item);
    });
  });
  root.querySelectorAll("[data-slider]").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = MENU.sliders.find(s => s.id === btn.dataset.slider);
      addSideToCart(item);
    });
  });
  const reviewBtn = document.getElementById("review-cart-btn");
  if (reviewBtn) reviewBtn.addEventListener("click", openCartReview);

  if (state.sheetType) wireSheet();
  if (state.showCartReview) wireCartReview();
}

function renderSheet() {
  if (state.sheetType === "burger") return renderBurgerSheet();
  if (state.sheetType === "taco") return renderTacoSheet();
  if (state.sheetType === "quesadilla") return renderQuesadillaSheet();
  return "";
}
function wireSheet() {
  if (state.sheetType === "burger") return wireBurgerSheet();
  if (state.sheetType === "taco") return wireTacoSheet();
  if (state.sheetType === "quesadilla") return wireQuesadillaSheet();
}

function renderBurgerSheet() {
  const item = state.sheetItem;
  const mods = state.sheetMods;
  const unitTotal = item.price;
  return `
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet">
        <h2>${item.name}</h2>
        <p class="sheet-sub">Tap to remove anything they don't want.</p>

        <div class="toggle-row">
          <span class="toggle-label">Grilled onions</span>
          <button class="toggle-pill ${mods.onions ? 'on' : ''}" data-mod="onions"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Mustard</span>
          <button class="toggle-pill ${mods.mustard ? 'on' : ''}" data-mod="mustard"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Pickle</span>
          <button class="toggle-pill ${mods.pickle ? 'on' : ''}" data-mod="pickle"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">American cheese</span>
          <button class="toggle-pill ${mods.cheese ? 'on' : ''}" data-mod="cheese"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Add raw jalapeño</span>
          <button class="toggle-pill jalapeno ${mods.jalapenoRaw ? 'on' : ''}" data-mod="jalapenoRaw"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Add grilled jalapeño</span>
          <button class="toggle-pill jalapeno ${mods.jalapenoGrilled ? 'on' : ''}" data-mod="jalapenoGrilled"></button>
        </div>

        <div class="qty-row">
          <span class="qty-label">Quantity</span>
          <div class="qty-stepper">
            <button class="qty-btn" id="qty-minus">–</button>
            <span class="qty-num">${state.sheetQty}</span>
            <button class="qty-btn" id="qty-plus">+</button>
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn-secondary" id="cancel-sheet-btn">Cancel</button>
          <button class="btn-primary" id="add-to-cart-btn">Add — ${fmt(unitTotal * state.sheetQty)}</button>
        </div>
      </div>
    </div>
  `;
}
function wireBurgerSheet() {
  document.getElementById("sheet-overlay").addEventListener("click", (e) => {
    if (e.target.id === "sheet-overlay") closeSheet();
  });
  document.querySelectorAll("[data-mod]").forEach(btn => {
    btn.addEventListener("click", () => toggleMod(btn.dataset.mod));
  });
  document.getElementById("qty-minus").addEventListener("click", () => changeQty(-1));
  document.getElementById("qty-plus").addEventListener("click", () => changeQty(1));
  document.getElementById("cancel-sheet-btn").addEventListener("click", closeSheet);
  document.getElementById("add-to-cart-btn").addEventListener("click", addBurgerToCart);
}

function renderTacoSheet() {
  const item = state.sheetItem;
  const mods = state.sheetMods;
  const tortilla = state.sheetTortilla;
  return `
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet">
        <h2>${item.name}</h2>
        <p class="sheet-sub">Pick a tortilla. Raw onion comes standard.</p>

        <div class="sheet-actions" style="margin-top:0;margin-bottom:16px;">
          <button class="btn-secondary" id="tortilla-corn" style="${tortilla === 'corn' ? 'background:var(--herb);color:#fff;border-color:var(--herb);' : ''}">Corn</button>
          <button class="btn-secondary" id="tortilla-flour" style="${tortilla === 'flour' ? 'background:var(--herb);color:#fff;border-color:var(--herb);' : ''}">Flour</button>
        </div>

        <div class="toggle-row">
          <span class="toggle-label">Onion</span>
          <button class="toggle-pill ${mods.onion ? 'on' : ''}" data-mod="onion"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Add raw jalapeño</span>
          <button class="toggle-pill jalapeno ${mods.jalapenoRaw ? 'on' : ''}" data-mod="jalapenoRaw"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Add grilled jalapeño</span>
          <button class="toggle-pill jalapeno ${mods.jalapenoGrilled ? 'on' : ''}" data-mod="jalapenoGrilled"></button>
        </div>

        <div class="qty-row">
          <span class="qty-label">Quantity</span>
          <div class="qty-stepper">
            <button class="qty-btn" id="qty-minus">–</button>
            <span class="qty-num">${state.sheetQty}</span>
            <button class="qty-btn" id="qty-plus">+</button>
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn-secondary" id="cancel-sheet-btn">Cancel</button>
          <button class="btn-primary" id="add-to-cart-btn">Add — ${fmt(item.price * state.sheetQty)}</button>
        </div>
      </div>
    </div>
  `;
}
function wireTacoSheet() {
  document.getElementById("sheet-overlay").addEventListener("click", (e) => {
    if (e.target.id === "sheet-overlay") closeSheet();
  });
  document.getElementById("tortilla-corn").addEventListener("click", () => setTortilla("corn"));
  document.getElementById("tortilla-flour").addEventListener("click", () => setTortilla("flour"));
  document.querySelectorAll("[data-mod]").forEach(btn => {
    btn.addEventListener("click", () => toggleMod(btn.dataset.mod));
  });
  document.getElementById("qty-minus").addEventListener("click", () => changeQty(-1));
  document.getElementById("qty-plus").addEventListener("click", () => changeQty(1));
  document.getElementById("cancel-sheet-btn").addEventListener("click", closeSheet);
  document.getElementById("add-to-cart-btn").addEventListener("click", addTacoToCart);
}

function renderQuesadillaSheet() {
  const item = state.sheetItem;
  const protein = state.sheetProtein;
  return `
    <div class="sheet-overlay" id="sheet-overlay">
      <div class="sheet">
        <h2>${item.name}</h2>
        <p class="sheet-sub">Pick a protein.</p>

        <div class="sheet-actions" style="margin-top:6px;">
          <button class="btn-secondary" id="protein-chicken" style="${protein === 'chicken' ? 'background:var(--herb);color:#fff;border-color:var(--herb);' : ''}">Chicken</button>
          <button class="btn-secondary" id="protein-pork" style="${protein === 'pork' ? 'background:var(--herb);color:#fff;border-color:var(--herb);' : ''}">Pork</button>
        </div>

        <div class="qty-row">
          <span class="qty-label">Quantity</span>
          <div class="qty-stepper">
            <button class="qty-btn" id="qty-minus">–</button>
            <span class="qty-num">${state.sheetQty}</span>
            <button class="qty-btn" id="qty-plus">+</button>
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn-secondary" id="cancel-sheet-btn">Cancel</button>
          <button class="btn-primary" id="add-to-cart-btn">Add — ${fmt(item.price * state.sheetQty)}</button>
        </div>
      </div>
    </div>
  `;
}
function wireQuesadillaSheet() {
  document.getElementById("sheet-overlay").addEventListener("click", (e) => {
    if (e.target.id === "sheet-overlay") closeSheet();
  });
  document.getElementById("protein-chicken").addEventListener("click", () => setProtein("chicken"));
  document.getElementById("protein-pork").addEventListener("click", () => setProtein("pork"));
  document.getElementById("qty-minus").addEventListener("click", () => changeQty(-1));
  document.getElementById("qty-plus").addEventListener("click", () => changeQty(1));
  document.getElementById("cancel-sheet-btn").addEventListener("click", closeSheet);
  document.getElementById("add-to-cart-btn").addEventListener("click", addQuesadillaToCart);
}

function renderCartReview() {
  return `
    <div class="sheet-overlay" id="cart-overlay">
      <div class="sheet">
        <h2>Your Order</h2>
        <p class="sheet-sub">Double check before sending it back.</p>
        ${state.cart.map(c => `
          <div class="cart-line">
            <div>
              <div class="cart-line-name">${c.qty > 1 ? c.qty + "× " : ""}${escapeHtml(c.name)}</div>
              ${c.modsText ? `<div class="cart-line-mods">${escapeHtml(c.modsText)}</div>` : ""}
              <button class="cart-line-remove" data-remove="${c.id}">Remove</button>
            </div>
            <div class="cart-line-price">${fmt(c.unitPrice * c.qty)}</div>
          </div>
        `).join("")}

        <div class="name-field">
          <label>Name for the ticket</label>
          <input type="text" id="name-input" placeholder="e.g. Zach" value="${escapeHtml(state.customerName)}" />
          ${state.nameError ? `<div class="name-error">${state.nameError}</div>` : ""}
          <div class="quick-names">
            ${QUICK_NAMES.map(n => `<button type="button" class="quick-name-chip" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join("")}
          </div>
        </div>

        <div class="sheet-actions">
          <button class="btn-secondary" id="back-to-menu-btn">Back</button>
          <button class="btn-primary" id="submit-order-btn">Continue to Payment — ${fmt(cartTotal())}</button>
        </div>
      </div>
    </div>
  `;
}
function wireCartReview() {
  document.getElementById("cart-overlay").addEventListener("click", (e) => {
    if (e.target.id === "cart-overlay") closeCartReview();
  });
  root_querySelectorAllRemove();
  document.getElementById("name-input").addEventListener("input", (e) => {
    state.customerName = e.target.value;
    state.nameError = null;
  });
  document.querySelectorAll(".quick-name-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      state.customerName = btn.dataset.name;
      state.nameError = null;
      render();
    });
  });
  document.getElementById("back-to-menu-btn").addEventListener("click", closeCartReview);
  document.getElementById("submit-order-btn").addEventListener("click", goToPaymentSelect);
}
function root_querySelectorAllRemove() {
  document.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => removeCartLine(btn.dataset.remove));
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

render();
listenToOrders();
listenToEighty6();
</script>
</body>
</html>
